name: ruLLM runtime contracts

on:
  pull_request:
    paths:
      - 'ruLLM/**'
      - 'Cargo.lock'
      - '.github/workflows/rullm-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'ruLLM/**'
      - 'Cargo.lock'
      - '.github/workflows/rullm-runtime.yml'
  workflow_dispatch:
    inputs:
      build_native:
        description: Build Linux and Windows native model servers for GPU execution
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-server:
    if: github.event_name == 'workflow_dispatch' && inputs.build_native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            cache: linux
            executable: ruda-serve
          - os: windows-2022
            platform: win-amd64
            cache: win
            executable: ruda-serve.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: rullm-${{ matrix.cache }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            rullm-${{ matrix.cache }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
            torch-${{ matrix.cache }}-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
      - name: Check ordered device shutdown
        run: cargo test --release --locked -p ruda-core --features std device::handle::channel::shutdown_tests -- --test-threads=1
      - name: Build native server
        run: cargo build --release --locked -p ruda-llm --bin ruda-serve --features serving,nvidia-ptx,tensor-parallel
      - name: Check command-line entry without model weights
        run: ./target/release/${{ matrix.executable }} --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rullm-native-${{ matrix.platform }}-${{ github.sha }}
          path: target/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cache.outputs.cache-primary-key }}

  standalone-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install standalone test toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup override set 1.90.0
      - name: Independent references and real std-only Rust tests
        run: python3 ruLLM/tools/run_runtime_validation.py --suite reference --suite core --timeout 180
      - name: Report
        if: always()
        run: cat ruLLM/validation/runtime-v2/validation.json
