name: Publish crates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_MIN_STACK: '16777216'
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Attach verified revision to main
        run: |
          git checkout -B main
          git branch --set-upstream-to=origin/main main
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Install release-plz
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: release-plz@0.3.165
      - name: Test publisher and version preparation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Configure version commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare and persist crate versions
        id: prepare
        run: python3 .github/scripts/prepare_release.py
      - name: Plan unpublished versions
        id: plan
        if: steps.prepare.outputs.revision != ''
        run: python3 .github/scripts/publish.py --plan
      - name: Check publication credential
        if: steps.prepare.outputs.revision != '' && steps.plan.outputs.pending != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure repository Actions secret CARGO_REGISTRY_TOKEN'
            exit 1
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.revision != '' && needs.plan.outputs.pending != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustc --version
          cargo --version
      - name: Restore Cargo build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ needs.plan.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.batch }}
          restore-keys: |
            publish-${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ needs.plan.outputs.revision }}-
            publish-${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
      - name: Check LLVM requirement for publication batch
        id: llvm
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          import publish
          packages, graph = publish.workspace()
          batch = publish.missing(packages, publish.ordered(graph))[:publish.BATCH_SIZE]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"required={'true' if 'ruda-driver-cpu' in batch else 'false'}\n")
          PY
      - name: Install upstream LLVM and MLIR 20
        if: steps.llvm.outputs.required == 'true'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/ruda-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/ruda-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/ruda-llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-20-dev libmlir-20-dev mlir-20-tools libclang-20-dev libpolly-20-dev libzstd-dev zlib1g-dev pkg-config
          echo 'MLIR_SYS_200_PREFIX=/usr/lib/llvm-20' >> "$GITHUB_ENV"
          echo 'TABLEGEN_200_PREFIX=/usr/lib/llvm-20' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=/usr/lib/llvm-20/lib' >> "$GITHUB_ENV"
          echo 'LD_LIBRARY_PATH=/usr/lib/llvm-20/lib' >> "$GITHUB_ENV"
      - name: Publish next five versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/publish.py --publish

  verify:
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.revision != '' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Confirm all workspace versions are on crates.io
        run: python3 .github/scripts/publish.py --check
