[package]
name = "ruda-tensor-capture"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = ["ruda-core/std", "ruda-tensor/std", "ruda-tensor-router/std"]
fusion = ["std", "ruda-tensor-router/fusion"]

[dependencies]
ruda-core = { path = "../../ruda-core", default-features = false }
ruda-tensor = { path = "..", default-features = false, features = ["graph"] }
ruda-tensor-router = { path = "../router", default-features = false }
spin = { version = "0.10.0", default-features = false, features = ["mutex", "spin_mutex", "portable-atomic"] }
